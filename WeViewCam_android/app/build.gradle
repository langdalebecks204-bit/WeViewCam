plugins {
    id 'com.android.application'
}

android {
    namespace 'com.weviewcam.client'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.weviewcam.client"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "0.1.3"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/libc++_shared.so',
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libjnidispatch.so',
                'lib/armeabi-v7a/libjnidispatch.so'
            ]
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
}

// 自动将编译好的 debug APK 严格从 outputs/apk/debug 目录复制出来
tasks.register('copyApkToRoot') {
    doLast {
        def debugApk = file("${project.layout.buildDirectory.get().asFile}/outputs/apk/debug/app-debug.apk")
        def releaseApk = file("${project.layout.buildDirectory.get().asFile}/outputs/apk/release/app-release.apk")
        
        File sourceApk = null
        if (debugApk.exists()) {
            sourceApk = debugApk
        } else if (releaseApk.exists()) {
            sourceApk = releaseApk
        }

        if (sourceApk != null && sourceApk.exists()) {
            def releaseApkName = "weviewcam_android_v${android.defaultConfig.versionName}.apk"
            println ">>> [Auto-Copy] 严格从输出目录复制全新编译 APK: ${sourceApk.absolutePath} (${sourceApk.length()} bytes)"
            
            // 复制到 WeViewCam_android/app-debug.apk
            copy {
                from sourceApk
                into rootProject.projectDir
                rename { "app-debug.apk" }
            }
            // 复制到 WeViewCam_android/weviewcam_android_v0.1.3.apk
            copy {
                from sourceApk
                into rootProject.projectDir
                rename { releaseApkName }
            }
            // 复制到工作区根目录 D:\code\WeViewCam\weviewcam_android_v0.1.3.apk
            copy {
                from sourceApk
                into rootProject.projectDir.parentFile
                rename { releaseApkName }
            }
            println ">>> [Auto-Copy] 成功复制并重命名至: ${new File(rootProject.projectDir.parentFile, releaseApkName).absolutePath}"
        } else {
            println ">>> [Auto-Copy] 警告: 未在 outputs/apk/debug 找到新编译的 APK 文件!"
        }
    }
}

tasks.matching { it.name.startsWith("assemble") }.configureEach {
    it.finalizedBy 'copyApkToRoot'
}

