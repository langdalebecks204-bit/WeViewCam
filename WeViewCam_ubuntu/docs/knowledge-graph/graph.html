},{"from":"mod:ui/video_widget.py","to":"mod:adapters/onvif/player.py","type":"imports_lazy","note":"导入: RtspPlayerManager"}],"issues":[{"id":"BUG-01","severity":"high","title":"reopen_playback 实参顺序与接口签名不一致","where":"core/player_controller.py:391","affects":["cls:core/player_controller.py#PlayerController","cls:core/base_adapter.py#BaseDeviceAdapter"],"detail":"start_playback_by_time 的签名是 (channel_no, win_id, start_time, end_time)，此处按位置传入 (channel_no, start_t, end_t, w_id)，导致 win_id 收到 datetime、start_time 收到 end_time、end_time 收到窗口句柄。模拟模式下不报错，真实 SDK 下回放窗口最大化/全屏将失败或错位。","fix":"改为关键字传参 adapter.start_playback_by_time(channel_no=channel_no, win_id=w_id, start_time=start_t, end_time=end_t)。"},{"id":"BUG-02","severity":"high","title":"访问不存在的 PlayerController.slots 属性","where":"ui/live_view_widget.py:257","affects":["cls:ui/live_view_widget.py#LiveViewWidget","cls:core/player_controller.py#PlayerController"],"detail":"当活动视口不是直播时，PTZ 回退分支遍历 self.player_controller.slots，但 PlayerController 只有私有 _slots，必然抛 AttributeError，导致云台在“选中空视口”场景下不可用。","fix":"在 PlayerController 暴露只读属性 slots（或 slots_live()），此处改用公开 API。"},{"id":"BUG-03","severity":"medium","title":"窗口表面回调注册后从不注销","where":"ui/video_widget.py:41,187 / adapters/onvif/player.py:228","affects":["cls:ui/video_widget.py#VideoSurface","cls:adapters/onvif/player.py#RtspPlayerManager"],"detail":"register_window_surface 被调用但 unregister_window_surface 无任何调用点，_WIN_SURFACE_REGISTRY 随视口销毁持续增长；winId 被复用时会向已销毁的 QWidget 派发 QImage。","fix":"在 VideoSurface.closeEvent/destroyed 信号中注销。"},{"id":"BUG-04","severity":"medium","title":"重开流失败后 is_recording 残留为 True","where":"core/player_controller.py:318-355","affects":["cls:core/player_controller.py#PlayerController","cls:core/player_controller.py#SlotState"],"detail":"reopen_live_play 先停止原录像（stop_record）但未清 is_recording；成功分支会重新 start_record 并置位，失败分支只重置 play_handle/is_live，未复位 is_recording。后果是 REC 指示灯残留为亮，且此后用户再点录像按钮无效（toggle_record_slot 在 play_handle < 0 时直接返回）。","fix":"失败分支中显式 slot.is_recording = False; slot.record_path = \"\"，或在停止录像后立即复位再由成功分支重建。"},{"id":"BUG-05","severity":"medium","title":"停止录像的提示对话框永远显示空路径","where":"ui/live_view_widget.py:412-415","affects":["cls:ui/live_view_widget.py#LiveViewWidget","cls:core/player_controller.py#PlayerController"],"detail":"分支先调用 toggle_record_slot 停止录像，该方法内部会清空 slot.record_path（core/player_controller.py:243），随后才读取同一个 state 对象的 record_path 拼进“录像已保存至”提示，因此用户永远看到空路径，无法知道文件存到哪里。","fix":"在调用 toggle_record_slot 之前先把 state.record_path 取到局部变量，再用它拼提示。"},{"id":"BUG-06","severity":"medium","title":"OpenCV 引擎在首帧到达前启动录像会静默无产出","where":"adapters/onvif/player.py:170-184","affects":["cls:adapters/onvif/player.py#OpencvRtspWorker","cls:adapters/onvif/player.py#RtspPlayerManager"],"detail":"start_record 在 latest_frame 为 None 时直接返回 True 并保持 writer=None（注释称首帧到达后会自动初始化），但 run() 只在 writer is not None 时写帧，且从不创建 writer。于是“流还没出图就先点录像”会返回成功却永远不生成文件，用户直到停止录像都不会发现。","fix":"在 run() 首次拿到帧时，若 record_path 已设置则初始化 VideoWriter；或在 start_record 等待首帧（带超时）后再返回结果。"},{"id":"RISK-01","severity":"high","title":"设备口令明文落盘","where":"core/device_manager.py:174","affects":["cls:core/device_manager.py#DeviceManager","cfg:config/devices.json"],"detail":"save_devices 直接把 password 写入 config/devices.json，且该文件常随打包脚本分发。","fix":"改用 keyring/加密存储，或至少对配置做文件权限收紧并在文档中告警。"},{"id":"RISK-02","severity":"medium","title":"save_devices 对无目录部分的路径会 makedirs 失败","where":"core/device_manager.py:165","affects":["cls:core/device_manager.py#DeviceManager"],"detail":"os.makedirs(os.path.dirname(self.config_path)) 在 config_path 为普通文件名（如 tests/xxx.json 之外的 \"devices.json\"）时 dirname 为空串，抛 FileNotFoundError。","fix":"dirname 为空时跳过 makedirs。"},{"id":"RISK-03","severity":"high","title":"ONVIF 回放/检索/下载为模拟实现","where":"adapters/onvif/adapter.py:240-274","affects":["cls:adapters/onvif/adapter.py#OnvifAdapter"],"detail":"find_records 恒返回当天 00:00-23:59 的假片段，start_playback_by_time 忽略时间范围直接拉主码流，get_playback_pos 恒返回 50，下载接口恒返回成功；ONVIF Profile G 未实现，时间轴与进度条对 ONVIF 设备无实际意义。","fix":"接入 Profile G / Replay 服务，或在 UI 中对 ONVIF 设备隐藏回放能力。"},{"id":"RISK-04","severity":"high","title":"登录失败仍返回成功，调用方无法感知降级","where":"adapters/onvif/adapter.py:97-99","affects":["cls:adapters/onvif/adapter.py#OnvifAdapter","cls:core/device_manager.py#DeviceManager"],"detail":"ONVIF 端口全部握手失败后设置 _is_logged_in = True 并返回 True，DeviceManager.connect_device 因此把设备标记为已连接、写入通道数并落盘；用户看到“连接成功”但实际无任何真实连接。","fix":"区分“模拟/演示模式”与“真实已连接”状态，并在 UI 上显式标识。"},{"id":"RISK-05","severity":"low","title":"重复结构体定义造成静默遮蔽","where":"adapters/hikvision/structures.py","affects":["grp:adapters/hikvision/structures.py","cls:adapters/hikvision/driver.py#HikvisionNativeDriver"],"detail":"NET_DVR_SETUPALARM_PARAM（401/444）、NET_DVR_IPADDR（211/486/647）、NET_DVR_TIME（472/619/848）各被重复定义，后定义静默覆盖前者。经逐字段核对，三组当前均为布局等价（SETUPALARM_PARAM 完全相同；IPADDR 均为 16+128 字节，仅 c_char/c_byte/c_ubyte 与字段名不同；TIME 完全相同），其中 NET_DVR_TIME 确实被 driver.py 导入，遮蔽已生效但当前无害。真正的问题是维护性：日后只修改其中一份会被静默忽略，新增字段时也容易改错位置。","fix":"删除重复定义各留一份，并对 driver 实际引用的结构加 ctypes.sizeof 断言，让不一致在导入期暴露。"},{"id":"RISK-06","severity":"low","title":"PlayCtrl.py 为未接线的死代码","where":"adapters/hikvision/PlayCtrl.py","affects":["grp:adapters/hikvision/PlayCtrl.py"],"detail":"FRAME_INFO/DISPLAY_INFO_YUV 与回调类型无任何 import 方，实际窗口刷新走 driver.refresh_play 的 PlayM4 端口调用。","fix":"需要自绘解码回调时再接线，否则删除以避免误导。"},{"id":"RISK-07","severity":"medium","title":"UI 线程内同步执行 SDK 检索与登录","where":"ui/playback_widget.py:265 / core/device_manager.py:148","affects":["cls:ui/playback_widget.py#PlaybackWidget","cls:core/device_manager.py#DeviceManager","cls:adapters/hikvision/driver.py#HikvisionNativeDriver"],"detail":"find_records 在驱动层最多轮询 100×0.05s(5s) 后超时，test_connection 同步登录；二者都在 GUI 线程调用，弱网设备会让界面失去响应（仅按钮文案变化，无真正异步）。","fix":"将检索/登录移入 QThread 或使用信号回传结果。"},{"id":"RISK-08","severity":"medium","title":"测试对真实 QApplication 与显示环境有隐含依赖","where":"tests/test_device_manager.py:81","affects":["mod:tests/test_device_manager.py"],"detail":"test_device_dialog_quick_names 直接构造 QApplication 与 QDialog，无显示环境下需 QT_QPA_PLATFORM=offscreen；CI 若未设置会失败或挂起。","fix":"在 conftest.py 中统一设置 offscreen 平台并复用 session 级 QApplication。"},{"id":"RISK-10","severity":"low","title":"诊断工具默认目标 IP 为硬编码内网地址","where":"scan_rtsp.py:275","affects":["mod:scan_rtsp.py"],"detail":"无参数运行时默认探测 10.0.25.206:admin/admin，属开发期遗留的现场地址，可能误连他人网络设备。","fix":"改为必填参数或使用示例保留地址。"},{"id":"RISK-11","severity":"medium","title":"Windows 开发环境下海康链路静默降级","where":"adapters/hikvision/driver.py:113","affects":["cls:adapters/hikvision/driver.py#HCNetSDKLibrary"],"detail":"非 Linux 平台不加载 .so 并直接进入模拟模式，所有登录/通道/预览都返回编造数据；当前仓库在 Windows 下开发（存在 __pycache__/*.cpython-312），容易把模拟结果误判为真实联调结果。","fix":"在 UI 状态栏区分“模拟模式”并写入日志与配置标识。"},{"id":"RISK-12","severity":"low","title":"RTSP 候选路径库缺少可配置的并发/超时上限","where":"adapters/onvif/adapter.py:279","affects":["cls:adapters/onvif/adapter.py#OnvifAdapter"],"detail":"候选 URL 达 40+ 条，OpenCV 引擎逐条串行尝试且每条都要等待连接超时，弱网下首帧出现时间不可控；无最大尝试次数与总超时收敛策略。","fix":"增加候选上限、可配置总超时，并优先使用缓存命中/ONVIF 返回值。"}],"flows":[{"id":"FLOW-BOOT","name":"应用启动","steps":["fn:main.py#main","fn:core/logger.py#setup_logger","cls:ui/main_window.py#MainWindow","cls:core/device_manager.py#DeviceManager","cls:core/player_controller.py#PlayerController","cls:ui/device_tree_widget.py#DeviceTreeWidget","cls:ui/live_view_widget.py#LiveViewWidget","cls:ui/playback_widget.py#PlaybackWidget","cls:adapters/hikvision/driver.py#HCNetSDKLibrary"]},{"id":"FLOW-LIVE","name":"双击通道开启实时预览","steps":["cls:ui/device_tree_widget.py#DeviceTreeWidget","cls:ui/main_window.py#MainWindow","cls:ui/live_view_widget.py#LiveViewWidget","cls:core/player_controller.py#PlayerController","cls:core/device_manager.py#DeviceManager","fn:adapters/factory.py#create_device_adapter","cls:core/base_adapter.py#BaseDeviceAdapter","cls:ui/video_widget.py#VideoSurface"]},{"id":"FLOW-ONVIF","name":"ONVIF 取流协商","steps":["cls:adapters/onvif/adapter.py#OnvifAdapter","cls:adapters/onvif/player.py#RtspPlayerManager","cls:adapters/onvif/player.py#OpencvRtspWorker","cls:ui/video_widget.py#VideoSurface"]},{"id":"FLOW-PLAYBACK","name":"录像检索与回放","steps":["   const l = G.layers.find(x => x.id === id);
  return l ? l.color : '#484f58';
}

const svg = document.getElementById('svg');
const stage = document.getElementById('stage');
const view = document.createElementNS('http://www.w3.org/2000/svg', 'g');
svg.appendChild(view);

const disabledLayers = new Set();
const bandLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const edgeLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const nodeLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
view.appendChild(bandLayer); view.appendChild(edgeLayer); view.appendChild(nodeLayer);

document.getElementById('stats').textContent =
  ` · ${G.nodes.length} 节点 / ${G.edges.length} 关系 / ${(G.issues||[]).length} 问题`;

// ---------- 背景与分层标题 ----------
G.layout.bands.forEach(b => {
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', b.x - 14); r.setAttribute('y', 20);
  r.setAttribute('width', Math.max(b.width + 28, 60));
  r.setAttribute('height', G.layout.height - 40);
  r.setAttribute('class', 'band'); r.setAttribute('rx', 10); r.setAttribute('opacity', '0.55');
  bandLayer.appendChild(r);
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', b.x - 2); t.setAttribute('y', 44);
  t.setAttribute('class', 'band-label'); t.textContent = `${b.name} (${b.count})`;
  bandLayer.appendChild(t);
});

// ---------- 边 ----------
const edgeEls = [];
G.paths.forEach(p => {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', p.d);
  path.setAttribute('class', 'edge');
  path.setAttribute('stroke', G.edge_colors[p.type] || '#484f58');
  const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
  const src = nodesById[p.from] ? nodesById[p.from].name : p.from;
  const dst = nodesById[p.to] ? nodesById[p.to].name : p.to;
  title.textContent = `${src} —[${p.type}]→ ${dst}${p.note ? '\n' + p.note : ''}`;
  path.appendChild(title);
  edgeLayer.appendChild(path);
  edgeEls.push({ el: path, from: p.from, to: p.to });
});

// ---------- 节点 ----------
const nodeEls = {};
G.nodes.forEach(n => {
  const p = G.layout.positions[n.id];
  if (!p) return;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'node' + (n.type === 'issue' ? ' issue' : ''));
  g.setAttribute('transform', `translate(${p.x},${p.y})`);
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('width', NODE_W); rect.setAttribute('height', NODE_H);
  g.appendChild(rect);
  const icon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  icon.setAttribute('x', 13); icon.setAttribute('y', 29); icon.setAttribute('class', 'type');
  icon.textContent = TYPE_ICON[n.type] || '•';
  g.appendChild(icon);
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', 38); label.setAttribute('y', 29);
  label.textContent = clip(n.name, 24);
  g.appendChild(label);
  const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bar.setAttribute('x', 0); bar.setAttribute('y', NODE_H - 4);
  bar.setAttribute('width', NODE_W); bar.setAttribute('height', 4);
  bar.setAttribute('fill', layerColor(n.layer)); bar.setAttribute('rx', 1.5);
  g.appendChild(bar);
  g.style.display = 'none';
  g.addEventListener('click', ev => { ev.stopPropagation(); showPanel(n); highlight(n.id); });
  g.addEventListener('mouseenter', () => highlight(n.id));
  g.addEventListener('mouseleave', () => highlight(null));
  nodeLayer.appendChild(g);
  nodeEls[n.id] = g;
});

function applyVisibility() {
  G.nodes.forEach(n => {
    const el = nodeEls[n.id];
    if (el) el.style.display = disabledLayers.has(n.layer) ? 'none' : '';
  });
}

// ---------- 图例 ----------
const legend = document.getElementById('layerLegend');
G.layers.forEach(l => {
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.innerHTML = `<span class="dot" style="background:${l.color}"></span>${l.name}`;
  chip.onclick = () => {
    if (disabledLayers.has(l.id)) disabledLayers.delete(l.id); else disabledLayers.add(l.id);
    chip.classList.toggle('off');
    applyVisibility();
  };
  legend.appendChild(chip);
});

// ---------- 搜索 ----------
const search = document.getElementById('search');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { G.nodes.forEach(n => nodeEls[n.id] && nodeEls[n.id].classList.remove('dim')); return; }
  G.nodes.forEach(n => {
    const el = nodeEls[n.id];
    if (!el) return;
    const hay = (n.name + ' ' + n.id + ' ' + (n.desc || '') + ' ' + (n.tags || []).join(' ')).toLowerCase();
    el.classList.toggle('dim', !hay.includes(q));
  });
});

// ---------- 高亮 ----------
function highlight(id) {
  edgeEls.forEach(e => {
    const hot = id && (e.from === id || e.to === id);
    e.el.classList.toggle('hot', !!hot);
    e.el.classList.toggle('dim', !!id && !hot);
  });
  if (!id) { G.nodes.forEach(n => nodeEls[n.id] && nodeEls[n.id].classList.remove('dim')); return; }
  const keep = new Set([id]);
  edgeEls.forEach(e => { if (e.from === id) keep.add(e.to); if (e.to === id) keep.add(e.from); });
  G.nodes.forEach(n => nodeEls[n.id] && nodeEls[n.id].classList.toggle('dim', !keep.has(n.id)));
}

// ---------- 详情面板 ----------
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function showPanel(n) {
  let html = `<h2>${esc(n.name)}</h2>`;
  html += `<div class="kv">${esc(n.type)} · ${esc(n.layer)}${n.path ? ' · <code>' + esc(n.path) + (n.line ? ':' + n.line : '') + '</code>' : ''}</div>`;
  if (n.desc) html += `<p>${esc(n.desc)}</p>`;
  if (n.tags && n.tags.length) html += `<div>${n.tags.map(t => `<span class="chip">${esc(t)}</span>`).join(' ')}</div>`;
  const m = n.meta || {};
  if (m.where) html += `<div class="kv">位置：<code>${esc(m.where)}</code></div>`;
  if (m.severity) html += `<div class="kv">严重级别：<span class="sev-${esc(m.severity)}">${esc(m.severity)}</span></div>`;
  if (m.fix) html += `<p><b>建议：</b>${esc(m.fix)}</p>`;
  if (m.methods && m.methods.length) {
    html += `<div class="kv">方法 (${m.methods.length})：</div><ul>`;
    m.methods.forEach(x => { html += `<li><code>${esc(x.name)}()</code> :${x.line}${x.doc ? ' — ' + esc(x.doc) : ''}</li>`; });
    html += '</ul>';
  }
  if (m.members && m.members.length) {
    html += `<div class="kv">包含 (${m.members.length})：</div><ul>`;
    m.members.slice(0, 80).forEach(x => { html += `<li><code>${esc(x.split('@')[0])}</code> :${esc(x.split('@')[1])}</li>`; });
    if (m.members.length > 80) html += `<li class="kv">… 其余 ${m.members.length - 80} 项见 JSON</li>`;
    html += '</ul>';
  }
  if (m.related) html += `<div class="kv">关联：${m.related.map(esc).join(', ')}</div>`;
  panelBody.innerHTML = html;
  panel.style.display = 'block';
  document.querySelectorAll('.node.sel').forEach(e => e.classList.remove('sel'));
  if (nodeEls[n.id]) nodeEls[n.id].classList.add('sel');
}
function hidePanel() {
  panel.style.display = 'none';
  document.querySelectorAll('.node.sel').forEach(e => e.classList.remove('sel'));
  highlight(null);
}

// ---------- 平移缩放 ----------
let scale = 1, tx = 0, ty = 0;
function applyTransform() { view.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }
function zoomBy(k) { scale = Math.min(4, Math.max(0.2, scale * k)); applyTransform(); }
function resetView() { fit(); }
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const k = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const ns = Math.min(4, Math.max(0.2, scale * k));
  tx = mx - (mx - tx) * (ns / scale); ty = my - (my - ty) * (ns / scale);
  scale = ns; applyTransform();
}, { passive: false });
let dragging = false, lastX = 0, lastY = 0;
stage.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; stage.classList.add('drag'); });
window.addEventListener('mouseup', () => { dragging = false; stage.classList.remove('drag'); });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; applyTransform();
});
stage.addEventListener('click', () => hidePanel());

// ---------- 尺寸自适应 ----------
function fit() {
  const w = stage.clientWidth || window.innerWidth || 1280;
  const h = stage.clientHeight || (window.innerHeight - 90) || 720;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const k = Math.min(w / G.layout.width, h / G.layout.height, 1);
  scale = k * 0.98;
  tx = Math.max(10, (w - G.layout.width * scale) / 2);
  ty = Math.max(10, (h - G.layout.height * scale) / 2);
  applyTransform();
}
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
fit();
requestAnimationFrame(fit);

// ---------- 初始化：默认只展开非 issue 层 ----------
G.layers.forEach(l => { /* 全部展开 */ });
applyVisibility();
document.getElementById('subtitle').textContent =
  `${G.meta.project} v${G.meta.version} · ${G.meta.runtime} · 入口 ${G.meta.entrypoint} · 生成于 ${G.meta.generated_at}`;
</script>
</body>
</html>
