[DEBUG]
; Enable logging
; Log level: 1=Fatal, 2=Error, 3=Warning, 4=Info, 5=Trace, 6=Debug (all logs)
loglevel=1

; Save input data (0=disable, 1=write to ./InputData_*.dat)
inputdata=0

; Enable D3D11 flip mode (0=disable, 1=enable). Effective on Windows 10+ systems. Required for display on specific PCs.
enabled3d11flip=0

; Configure logging channel (-1=disable)
printlogport=-1

; Enable VAAPI hardware decoding (0=disable, 1=enable). Linux systems only.
enablevadecode=1